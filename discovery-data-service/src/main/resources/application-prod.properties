# Production environment. No connection or credential defaults are allowed here.
spring.datasource.url=${MARKETPLACE_DATASOURCE_URL}
spring.datasource.username=${MARKETPLACE_DATASOURCE_USERNAME}
spring.datasource.password=${MARKETPLACE_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.data.redis.host=${MARKETPLACE_REDIS_HOST}
spring.data.redis.port=${MARKETPLACE_REDIS_PORT}
spring.kafka.bootstrap-servers=${MARKETPLACE_KAFKA_BOOTSTRAP_SERVERS}
spring.flyway.enabled=${MARKETPLACE_FLYWAY_ENABLED}
