<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'"><title>Marketplace · API Reference</title><style>
:root{color-scheme:light dark;--bg:light-dark(#f6f8fb,#121820);--panel:light-dark(#fff,#1d2734);--text:light-dark(#1b2c43,#e5edf7);--muted:light-dark(#51627a,#b0bfd3);--line:light-dark(#d5deeb,#3c4c60);--accent:light-dark(#175bb8,#8abaff);--good:light-dark(#12653e,#89d3ab);--warn:light-dark(#8d5200,#f4c97d)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,'Malgun Gothic',sans-serif}header{padding:20px 28px;border-bottom:1px solid var(--line);background:var(--panel)}h1{margin:0;font-size:22px}p{margin:6px 0;color:var(--muted)}.toolbar{padding:14px 28px;display:flex;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line)}input,select,button{font:inherit;padding:7px 10px;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:6px}button{cursor:pointer}.layout{display:grid;grid-template-columns:330px minmax(0,1fr);height:calc(100vh - 173px)}nav{overflow:auto;border-right:1px solid var(--line);padding:16px;background:var(--panel)}main{overflow:auto;padding:28px;max-width:1100px}nav button{width:100%;text-align:left;margin:4px 0;overflow-wrap:anywhere;border:0;font-size:12px}nav button.active{background:var(--accent);color:var(--bg)}.method{display:inline-block;min-width:52px;font-weight:700}h2{font-size:21px;overflow-wrap:anywhere;margin:0 0 10px}h3{margin:24px 0 8px;font-size:16px}.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:2px 8px;font-size:12px;margin:3px 4px 3px 0}.good{color:var(--good)}.warn{color:var(--warn)}pre{background:var(--panel);padding:16px;border:1px solid var(--line);border-radius:8px;overflow:auto;font:12px/1.6 Consolas,monospace}code{font:12px/1.6 Consolas,monospace;overflow-wrap:anywhere}a{color:var(--accent)}table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}.small{font-size:12px;color:var(--muted)}details{margin:10px 0}summary{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent)}@media(max-width:750px){.layout{display:block;height:auto}nav{max-height:260px}main{padding:16px}.toolbar,header{padding:16px}}
</style></head><body><header><h1>Marketplace / API 명세</h1><p>고객·판매자·관리자 · 서비스 내부 · PG1/PG2 — 문서 전용, 요청 실행 기능 없음</p></header><div class="toolbar"><label>계약 <select id="spec"></select></label><label>검색 <input id="search" type="search" placeholder="checkout, 환불, payout…"></label><span id="count" class="small"></span></div><div class="layout"><nav id="operations"></nav><main id="detail" aria-live="polite"></main></div>
<script type="application/json" id="api-data">__API_DATA__</script><script>
const data=JSON.parse(document.getElementById('api-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let specId='commerce-public',active='';const spec=()=>data[specId];function operations(){return Object.entries(spec().paths).flatMap(([path,methods])=>Object.entries(methods).filter(([method])=>['get','post','put','patch','delete'].includes(method)).map(([method,op])=>({path,method,op,key:method+' '+path})));}function resolve(s){return s?.$ref?spec().components.schemas[s.$ref.split('/').at(-1)]||{}:s||{};}function props(s){s=resolve(s);let p={...(s.properties||{})};for(const child of s.allOf||[])Object.assign(p,props(child));return p;}function required(s){s=resolve(s);return new Set([...(s.required||[]),...(s.allOf||[]).flatMap(x=>[...required(x)])]);}function type(s){if(s.$ref)return s.$ref.split('/').at(-1);if(s.anyOf)return s.anyOf.map(type).join(' | ');if(s.items)return'array<'+type(s.items)+'>';return Array.isArray(s.type)?s.type.join(' | '):s.type||'object';}function fields(s){const p=props(s),r=required(s);if(!Object.keys(p).length)return'<pre>'+esc(JSON.stringify(resolve(s),null,2))+'</pre>';return'<table><thead><tr><th>필드</th><th>타입 / 필수</th><th>검증 / 설명</th></tr></thead><tbody>'+Object.entries(p).map(([n,v])=>'<tr><td><code>'+esc(n)+'</code></td><td>'+esc(type(v))+'<br>'+ (r.has(n)?'필수':'선택')+'</td><td>'+esc([v.description,v.enum?'enum: '+v.enum.join(', '):'',v.const!==undefined?'const: '+v.const:'',v.minimum!==undefined?'min: '+v.minimum:'',v.maximum!==undefined?'max: '+v.maximum:'',v.pattern?'pattern: '+v.pattern:'',v.minItems!==undefined?'items: '+v.minItems+'..'+v.maxItems:''].filter(Boolean).join(' / '))+'</td></tr>').join('')+'</tbody></table>';}
function show(key){active=key;const item=operations().find(o=>o.key===key);if(!item)return;const {op,path,method}=item;const request=op.requestBody?.content?.['application/json'];$('detail').innerHTML='<span class="badge '+((op['x-implementation']||'planned').startsWith('implemented')?'good':'warn')+'">'+esc(op['x-implementation']||'planned')+'</span><h2>'+method.toUpperCase()+' '+esc(path)+'</h2><p>'+esc(op.summary)+'</p><p>'+esc(op.description||'')+'</p><div>'+ (op['x-requirements']||[]).map(r=>'<span class="badge">'+esc(r)+'</span>').join('')+'</div><h3>인증 · 권한</h3><pre>'+esc(JSON.stringify({security:op.security??spec().security,roles:op['x-authorized-roles'],scope:op['x-service-scope'],idempotency:op['x-idempotency']},null,2))+'</pre><h3>경로 · 쿼리 · 헤더</h3><table><thead><tr><th>이름 / 위치</th><th>필수 · 타입</th><th>설명</th></tr></thead><tbody>'+(op.parameters||[]).map(raw=>{const p=raw.$ref?spec().components.parameters[raw.$ref.split('/').at(-1)]:raw;return'<tr><td><code>'+esc(p.name)+'</code> / '+p.in+'</td><td>'+(p.required?'필수':'선택')+' · '+esc(type(p.schema))+'</td><td>'+esc(p.description||JSON.stringify(p.schema))+'</td></tr>';}).join('')+'</tbody></table><h3>요청 본문</h3>'+(request?fields(request.schema)+(request.example?'<details open><summary>예시 (합성 데이터)</summary><pre>'+esc(JSON.stringify(request.example,null,2))+'</pre></details>':''):op.requestBody?'<pre>'+esc(JSON.stringify(op.requestBody,null,2))+'</pre>':'<p>없음</p>')+'<h3>응답</h3>'+Object.entries(op.responses).map(([status,r])=>{r=r.$ref?spec().components.responses[r.$ref.split('/').at(-1)]:r;const media=r.content?.['application/json'];return'<details '+(status.startsWith('2')?'open':'')+'><summary><b>'+status+'</b> '+esc(r.description||'')+'</summary>'+(media?fields(media.schema)+(media.example?'<pre>'+esc(JSON.stringify(media.example,null,2))+'</pre>':''):'')+'</details>';}).join('')+'<h3>관련 schema 원문</h3>'+Object.entries(spec().components.schemas).filter(([n])=>JSON.stringify(op).includes('/'+n+'"')).map(([n,s])=>'<details><summary>'+esc(n)+'</summary><pre>'+esc(JSON.stringify(s,null,2))+'</pre></details>').join('');document.querySelectorAll('[data-operation]').forEach(b=>b.classList.toggle('active',b.dataset.operation===key));}
function list(){const q=$('search').value.toLowerCase(),items=operations().filter(x=>(x.key+' '+x.op.summary+' '+x.op.tags).toLowerCase().includes(q));$('operations').innerHTML=items.map(x=>'<button data-operation="'+esc(x.key)+'"><span class="method">'+x.method.toUpperCase()+'</span>'+esc(x.path)+'<br><span>'+esc(x.op.summary)+'</span></button>').join('');$('count').textContent=items.length+' / '+operations().length+' operations';document.querySelectorAll('[data-operation]').forEach(b=>b.onclick=()=>show(b.dataset.operation));if(!items.some(x=>x.key===active)&&items.length)show(items[0].key);else if(active)show(active);}
$('spec').innerHTML=Object.entries(data).map(([id,d])=>'<option value="'+id+'">'+esc(d.info.title)+'</option>').join('');$('spec').value=specId;$('spec').onchange=()=>{specId=$('spec').value;active='';list();};$('search').oninput=list;list();
</script></body></html>
