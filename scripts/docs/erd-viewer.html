<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'"><title>Marketplace · 서비스별 ERD</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f9fc,#131820);--panel:light-dark(#fff,#1c2430);--text:light-dark(#182537,#e5ecf5);--muted:light-dark(#516179,#aebed1);--line:light-dark(#cdd7e4,#3c4c62);--accent:light-dark(#175bc1,#86b6ff);--planned:light-dark(#935600,#ffcc7a)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 system-ui,'Malgun Gothic',sans-serif}header{padding:18px 24px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:22px;margin:0 0 4px}p{margin:4px 0;color:var(--muted)}a{color:var(--accent)}.toolbar{padding:12px 24px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;border-bottom:1px solid var(--line)}input,select,button{font:inherit;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px}button{cursor:pointer}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--accent)}.layout{display:grid;grid-template-columns:245px minmax(360px,1fr) 350px;height:calc(100vh - 163px);min-height:550px}nav,aside{padding:18px;overflow:auto;background:var(--panel)}nav{border-right:1px solid var(--line)}aside{border-left:1px solid var(--line)}main{overflow:auto;min-width:0;padding:20px}.group{display:block;width:100%;text-align:left;margin:6px 0}.group.active{background:var(--accent);color:var(--bg)}.small{font-size:12px;color:var(--muted)}.badge{font-size:11px;display:inline-block;border:1px solid var(--line);padding:1px 5px;border-radius:4px;color:var(--muted)}.planned{color:var(--planned)}h2{font-size:17px;margin:0 0 12px;overflow-wrap:anywhere}h3{font-size:14px;margin:20px 0 8px}table{border-collapse:collapse;width:100%;font-size:12px}td,th{padding:7px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top;overflow-wrap:anywhere}code{font:12px/1.5 ui-monospace,Consolas,monospace;overflow-wrap:anywhere}details{margin:8px 0}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}#diagram svg{display:block;overflow:visible}svg .box{fill:var(--panel);stroke:var(--line)}svg .box.selected{stroke:var(--accent);stroke-width:2.5}svg text{fill:var(--text);font:12px ui-monospace,Consolas,monospace}svg .heading{font-size:13px;font-weight:600}svg .relation{fill:none;stroke:var(--muted);opacity:.55;stroke-width:1.3}svg .relation.planned{stroke:var(--planned);stroke-dasharray:5 4}svg .table-node{cursor:pointer}svg .table-node:focus{outline:none}svg .table-node:focus .box{stroke:var(--accent);stroke-width:3}.legend{margin:0 0 14px;color:var(--muted);font-size:12px}.results button{display:block;margin:4px 0;width:100%;text-align:left}#stat{margin-left:auto}.download{font-size:12px}@media(max-width:1150px){.layout{grid-template-columns:220px minmax(350px,1fr)}aside{grid-column:1/-1;border-top:1px solid var(--line);max-height:450px}.layout{height:auto}main{min-height:600px}}@media(max-width:600px){.layout{display:block}nav{max-height:220px}header,.toolbar{padding:14px}main{padding:10px}#stat{margin-left:0}}
</style></head>
<body><header><h1>Marketplace / 데이터 모델</h1><p>서비스별 DB · 현재 마이그레이션과 v1 목표 모델을 분리해 확인합니다.</p></header>
<div class="toolbar"><label>모델 <select id="mode"><option value="current">현재 물리 구조</option><option value="target">v1 목표 구조 — 미적용</option></select></label><label>테이블 검색 <input id="search" type="search" placeholder="payment, order_item…"></label><button id="neighbors">선택 테이블과 직접 관계만</button><span id="stat" class="small"></span></div>
<div class="layout"><nav><h2>업무 영역</h2><div id="groups"></div><div class="results" id="results"></div><p class="small">각 DB의 실제 schema는 별도입니다. commerce/payment 등의 접두사는 문서용 서비스 이름이며 하나의 DB schema 구성이 아닙니다.</p><p><a href="README.md">읽는 방법 / 모델 출처</a></p></nav><main><h2 id="title"></h2><p class="legend">선 = 서비스 내부 FK · 주황 점선 = 추가 예정 FK · 양 끝 1 / 0..1 / 0..N · 표 클릭 시 전체 컬럼·제약 확인</p><div id="diagram"></div></main><aside id="detail" aria-live="polite"></aside></div>
<script id="model-data" type="application/json">__MODEL_DATA__</script>
<script>
const data=JSON.parse(document.getElementById('model-data').textContent),$=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let mode='current',groupId=data.current.groups.find(g=>g.service==='payment-service').id,selected='payment.payment',focused=false;
const model=()=>data[mode];const table=id=>model().tables.find(t=>t.id===id);
function cards(){const group=model().groups.find(g=>g.id===groupId)||model().groups[0];return focused?[...new Set([selected,...model().fks.filter(f=>f.from===selected||f.to===selected).flatMap(f=>[f.from,f.to])])]:group.tableIds;}
function detail(){const t=table(selected);if(!t)return;const fks=model().fks.filter(f=>f.from===t.id||f.to===t.id);const fkc=new Set(fks.filter(f=>f.from===t.id).flatMap(f=>f.columns));$('detail').innerHTML='<h2>'+esc(t.id)+'</h2><span class="badge '+(t.status==='current'?'':'planned')+'">'+esc(t.status.toUpperCase())+'</span><p class="small">'+esc(t.service)+' / '+esc(t.schema)+'.'+esc(t.name)+'</p><p>'+esc(t.note||'마이그레이션에서 추출한 현재 정의')+'</p><h3>전체 컬럼 ('+t.columns.length+')</h3><table><thead><tr><th>컬럼 / 키</th><th>타입 / NULL</th></tr></thead><tbody>'+t.columns.map(c=>'<tr><td><code>'+esc(c.name)+'</code><br><span class="badge">'+[t.pk.includes(c.name)?'PK':'',fkc.has(c.name)?'FK':'',t.unique.some(k=>k.length===1&&k[0]===c.name)?'UK':''].filter(Boolean).join(' ')+'</span></td><td><code>'+esc(c.type)+'</code><br>'+ (c.nullable?'nullable':'NOT NULL')+(c.status?' · 추가/변경':'')+'</td></tr>').join('')+'</tbody></table><h3>관계 ('+fks.length+')</h3>'+fks.map(f=>'<p class="small"><code>'+esc(f.from+'.('+f.columns.join(',')+') → '+f.to+'.('+f.targetColumns.join(',')+')')+'</code></p>').join('')+'<h3>키·제약·인덱스</h3><p class="small">PK: '+esc(t.pk.join(', '))+'<br>UNIQUE: '+esc(t.unique.map(k=>'('+k.join(', ')+')').join(' / ')||'없음')+'</p>'+[...t.constraints,...t.indexes.map(i=>i.sql)].map(c=>'<details><summary>'+esc(c.slice(0,64))+'</summary><pre>'+esc(c)+'</pre></details>').join('');}
function select(id){selected=id;detail();draw();}
function draw(){const ids=cards(),ts=ids.map(table).filter(Boolean),positions=new Map(),cols=2,w=315,gap=86,row=330;ts.forEach((t,j)=>positions.set(t.id,{x:28+(j%cols)*(w+gap),y:40+Math.floor(j/cols)*row}));const fks=model().fks.filter(f=>positions.has(f.from)&&positions.has(f.to));let out='<svg xmlns="http://www.w3.org/2000/svg" width="850" height="'+Math.max(390,Math.ceil(ts.length/cols)*row+45)+'" role="img" aria-label="서비스 내부 테이블 관계">';
for(const f of fks){const a=positions.get(f.from),b=positions.get(f.to),child=table(f.from),optional=f.columns.some(n=>child.columns.find(c=>c.name===n).nullable),one=[child.pk,...child.unique].some(k=>k.every(n=>f.columns.includes(n))),right=a.x<b.x,ax=right?a.x+w:a.x,bx=right?b.x:b.x+w,ay=a.y+45,by=b.y+45;let path;if(f.from===f.to)path='M '+(a.x+w)+' '+ay+' C '+(a.x+w+45)+' '+ay+' '+(a.x+w+45)+' '+(ay+95)+' '+(a.x+w)+' '+(ay+95);else path='M '+ax+' '+ay+' C '+((ax+bx)/2)+' '+ay+' '+((ax+bx)/2)+' '+by+' '+bx+' '+by;out+='<path class="relation '+(f.status?'planned':'')+'" d="'+path+'"><title>'+esc(f.name+': '+f.columns.join(',')+' → '+f.targetColumns.join(','))+'</title></path><text x="'+(ax+(right?5:-38))+'" y="'+(ay-7)+'">'+(one?'0..1':'0..N')+'</text><text x="'+(bx+(right?-37:5))+'" y="'+(by-7)+'">'+(optional?'0..1':'1')+'</text>';}
for(const t of ts){const p=positions.get(t.id),fkc=new Set(model().fks.filter(f=>f.from===t.id).flatMap(f=>f.columns)),key=t.columns.filter(c=>t.pk.includes(c.name)||fkc.has(c.name)),shown=[...key,...t.columns.filter(c=>!key.includes(c))].slice(0,8);out+='<g class="table-node" tabindex="0" role="button" aria-label="'+esc(t.id)+'" data-table="'+esc(t.id)+'"><rect class="box '+(t.id===selected?'selected':'')+'" x="'+p.x+'" y="'+p.y+'" width="'+w+'" height="260" rx="8"/><text class="heading" x="'+(p.x+12)+'" y="'+(p.y+25)+'">'+esc(t.id)+'</text><text x="'+(p.x+12)+'" y="'+(p.y+48)+'">'+esc(t.status.toUpperCase())+' · '+t.columns.length+' columns</text>';shown.forEach((c,k)=>{const prefix=t.pk.includes(c.name)?'PK ':fkc.has(c.name)?'FK ':'   ';out+='<text x="'+(p.x+12)+'" y="'+(p.y+75+k*21)+'">'+esc((prefix+c.name).slice(0,39))+'</text>';});out+='<text x="'+(p.x+12)+'" y="'+(p.y+246)+'">전체 컬럼 / 관계 보기 →</text></g>';}
out+='</svg>';$('diagram').innerHTML=out;document.querySelectorAll('[data-table]').forEach(el=>{el.onclick=()=>select(el.dataset.table);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();select(el.dataset.table);}};});const g=model().groups.find(g=>g.id===groupId);$('title').textContent=focused?selected+' / 직접 연결':g.label;$('stat').textContent=model().tables.length+' tables · '+model().fks.length+' FKs · '+(mode==='current'?'현재 정의':'설계 목표 / DB 미적용');}
function renderGroups(){$('groups').innerHTML=model().groups.map(g=>'<button class="group '+(g.id===groupId?'active':'')+'" data-group="'+g.id+'">'+esc(g.label)+' <span class="small">'+g.tableIds.length+'</span></button>').join('');document.querySelectorAll('[data-group]').forEach(b=>b.onclick=()=>{groupId=b.dataset.group;focused=false;selected=model().groups.find(g=>g.id===groupId).tableIds[0];renderGroups();detail();draw();});}
$('mode').onchange=()=>{mode=$('mode').value;if(!table(selected))selected=model().tables[0].id;groupId=model().groups.find(g=>g.tableIds.includes(selected)).id;renderGroups();detail();draw();};$('neighbors').onclick=()=>{focused=!focused;draw();};$('search').oninput=()=>{const q=$('search').value.trim().toLowerCase();$('results').innerHTML=q?model().tables.filter(t=>t.id.includes(q)).slice(0,30).map(t=>'<button data-result="'+t.id+'">'+esc(t.id)+'</button>').join(''):'';document.querySelectorAll('[data-result]').forEach(b=>b.onclick=()=>{selected=b.dataset.result;groupId=model().groups.find(g=>g.tableIds.includes(selected)).id;focused=true;renderGroups();detail();draw();});};renderGroups();detail();draw();
</script></body></html>
